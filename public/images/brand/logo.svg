<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%" fill="none">
  <!-- Honeycomb Emblem -->
  <g transform="translate(10, 10)">
    <!-- Hexagon Outer -->
    <polygon points="50,5 90,28 90,75 50,98 10,75 10,28" fill="#F8F3E8" stroke="#D9A441" stroke-width="3" />
    <polygon points="50,12 83,31 83,71 50,90 17,71 17,31" fill="#FFFFFF" stroke="#254D38" stroke-width="1.5" stroke-dasharray="3 2" />
    
    <!-- Mountain Peaks -->
    <path d="M22,70 L40,42 L52,58 L65,36 L78,70 Z" fill="#254D38" />
    <path d="M40,42 L46,50 L34,50 Z" fill="#F8F3E8" opacity="0.8" />
    <path d="M65,36 L71,46 L59,46 Z" fill="#F8F3E8" opacity="0.8" />
    
    <!-- Golden Sun/Honey Droplet -->
    <circle cx="50" cy="30" r="7" fill="#D9A441" />
    
    <!-- Little Honey Bee -->
    <ellipse cx="50" cy="62" rx="6" ry="4" fill="#D9A441" />
    <ellipse cx="46" cy="58" rx="4" ry="2" fill="#FFFFFF" opacity="0.9" transform="rotate(-30 46 58)" />
    <ellipse cx="54" cy="58" rx="4" ry="2" fill="#FFFFFF" opacity="0.9" transform="rotate(30 54 58)" />
  </g>

  <!-- Typography -->
  <text x="120" y="52" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="#254D38" letter-spacing="1.5">KAMRU GHATI</text>
  <text x="122" y="78" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#D9A441" letter-spacing="5">HONEY</text>
  
  <!-- Est Milestone & Origin -->
  <line x1="122" y1="88" x2="350" y2="88" stroke="#E6D7BD" stroke-width="1" />
  <text x="122" y="103" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#573A2B" letter-spacing="1.5">EST. 2020 • MANDI, HIMACHAL PRADESH</text>
</svg>
