<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSpiti" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7FAF9"/>
      <stop offset="100%" stop-color="#E9F1EE"/>
    </linearGradient>
    <linearGradient id="spitiHoney" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD475"/>
      <stop offset="50%" stop-color="#E2A638"/>
      <stop offset="100%" stop-color="#BE7B1A"/>
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#254D38" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#254D38" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" rx="24" fill="url(#bgSpiti)"/>

  <!-- High Himalayan Silhouette in BG -->
  <polygon points="60,350 180,180 260,280 370,140 480,290 560,200 600,260 600,500 0,500 0,330" fill="url(#mountainGrad)"/>
  <!-- Snow Peaks -->
  <polygon points="180,180 205,215 155,215" fill="#FFFFFF" opacity="0.8"/>
  <polygon points="370,140 405,190 335,190" fill="#FFFFFF" opacity="0.8"/>

  <!-- Shadow under jar -->
  <ellipse cx="300" cy="510" rx="140" ry="24" fill="#254D38" opacity="0.15"/>

  <!-- Glass Octagon Style Jar -->
  <rect x="180" y="210" width="240" height="280" rx="30" fill="url(#spitiHoney)"/>

  <!-- Glass Highlights -->
  <rect x="180" y="210" width="240" height="280" rx="30" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.8"/>
  <rect x="195" y="230" width="22" height="240" rx="11" fill="#FFFFFF" opacity="0.5"/>

  <!-- Jar Neck & Cap -->
  <rect x="220" y="175" width="160" height="35" rx="6" fill="#F0E8D5" stroke="#E6D7BD" stroke-width="2"/>

  <!-- Lid in Natural Earth Gold -->
  <ellipse cx="300" cy="175" rx="100" ry="24" fill="#573A2B"/>
  <rect x="200" y="160" width="200" height="22" rx="6" fill="#573A2B"/>
  <ellipse cx="300" cy="160" rx="100" ry="18" fill="#462E22"/>

  <!-- Gold Seal Ring -->
  <line x1="200" y1="182" x2="400" y2="182" stroke="#D9A441" stroke-width="3"/>

  <!-- Label -->
  <rect x="210" y="270" width="180" height="150" rx="12" fill="#FFFFFF" stroke="#DEEBE4" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.06))"/>
  
  <text x="300" y="315" font-family="'Playfair Display', Georgia, serif" font-size="12" font-weight="700" fill="#254D38" text-anchor="middle" letter-spacing="1">KAMRU GHATI</text>
  <text x="300" y="345" font-family="'Inter', sans-serif" font-size="15" font-weight="800" fill="#254D38" text-anchor="middle">LAHUL SPITI</text>
  <text x="300" y="365" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#D9A441" text-anchor="middle">HIGH ALTITUDE HONEY</text>
  <line x1="240" y1="375" x2="360" y2="375" stroke="#E6D7BD" stroke-width="1"/>
  <text x="300" y="393" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#573A2B" text-anchor="middle">COLD DESERT VALLEY</text>
  <text x="300" y="407" font-family="'Inter', sans-serif" font-size="8" font-weight="500" fill="#8E6E5D" text-anchor="middle">HIMACHAL PRADESH</text>

  <!-- High-Altitude Snowflake/Peak Badge -->
  <g transform="translate(430, 390)">
    <circle cx="40" cy="40" r="36" fill="#FFFFFF" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.1))"/>
    <circle cx="40" cy="40" r="32" fill="#F2F7F4"/>
    <polygon points="40,25 48,37 32,37" fill="#254D38"/>
    <polygon points="40,32 54,53 26,53" fill="#254D38"/>
  </g>
</svg>
