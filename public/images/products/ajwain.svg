<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAjwain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF5"/>
      <stop offset="100%" stop-color="#F2E9DB"/>
    </linearGradient>
    <linearGradient id="ajwainHoney" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBB64D"/>
      <stop offset="50%" stop-color="#C98627"/>
      <stop offset="100%" stop-color="#935515"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" rx="24" fill="url(#bgAjwain)"/>

  <!-- Botanical Umbel Branch Pattern -->
  <g opacity="0.2" stroke="#573A2B" stroke-width="1.5" fill="none">
    <path d="M 100 480 Q 120 320 80 180" />
    <circle cx="80" cy="180" r="4" fill="#D9A441"/>
    <circle cx="70" cy="170" r="3" fill="#D9A441"/>
    <circle cx="90" cy="170" r="3" fill="#D9A441"/>
    <path d="M 500 500 Q 480 340 520 200" />
    <circle cx="520" cy="200" r="4" fill="#D9A441"/>
  </g>

  <!-- Shadow -->
  <ellipse cx="300" cy="510" rx="140" ry="24" fill="#573A2B" opacity="0.18"/>

  <!-- Jar Body -->
  <rect x="180" y="210" width="240" height="280" rx="30" fill="url(#ajwainHoney)"/>

  <!-- Glass Highlights -->
  <rect x="180" y="210" width="240" height="280" rx="30" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.8"/>
  <rect x="195" y="230" width="22" height="240" rx="11" fill="#FFFFFF" opacity="0.45"/>

  <!-- Jar Neck & Cap -->
  <rect x="220" y="175" width="160" height="35" rx="6" fill="#F0E8D5" stroke="#E6D7BD" stroke-width="2"/>
  <ellipse cx="300" cy="175" rx="100" ry="24" fill="#254D38"/>
  <rect x="200" y="160" width="200" height="22" rx="6" fill="#254D38"/>
  <ellipse cx="300" cy="160" rx="100" ry="18" fill="#1E402E"/>
  <line x1="200" y1="182" x2="400" y2="182" stroke="#D9A441" stroke-width="3"/>

  <!-- Label -->
  <rect x="210" y="270" width="180" height="150" rx="12" fill="#FFFDF9" stroke="#E6D7BD" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.08))"/>
  
  <text x="300" y="315" font-family="'Playfair Display', Georgia, serif" font-size="12" font-weight="700" fill="#254D38" text-anchor="middle" letter-spacing="1">KAMRU GHATI</text>
  <text x="300" y="345" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#BA842E" text-anchor="middle">AJWAIN</text>
  <text x="300" y="365" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#573A2B" text-anchor="middle">CAROM BLOSSOM HONEY</text>
  <line x1="240" y1="375" x2="360" y2="375" stroke="#E6D7BD" stroke-width="1"/>
  <text x="300" y="393" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#254D38" text-anchor="middle">NATURAL HERBAL AROMA</text>
  <text x="300" y="407" font-family="'Inter', sans-serif" font-size="8" font-weight="500" fill="#8E6E5D" text-anchor="middle">SINGLE HARVEST FLORA</text>

  <!-- Leaf / Herbal Badge -->
  <g transform="translate(430, 390)">
    <circle cx="40" cy="40" r="36" fill="#FFFFFF" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.1))"/>
    <circle cx="40" cy="40" r="32" fill="#FDF9EE"/>
    <path d="M 40 24 C 55 35 55 52 40 56 C 25 52 25 35 40 24 Z" fill="#254D38"/>
    <line x1="40" y1="26" x2="40" y2="54" stroke="#D9A441" stroke-width="1.5"/>
  </g>
</svg>
